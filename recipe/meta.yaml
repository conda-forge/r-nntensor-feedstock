{% set version = "1.4.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-nntensor
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/nnTensor_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/nnTensor/nnTensor_{{ version }}.tar.gz
  sha256: 54e9ea6d0cbda099bb5342e34860bb4ea7d91e3568bb6053b7d1b1fb8b28beac

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-mass
    - r-fields
    - r-ggplot2
    - r-plot3d
    - r-rtensor
    - r-tagcloud
  run:
    - r-base
    - r-mass
    - r-fields
    - r-ggplot2
    - r-plot3d
    - r-rtensor
    - r-tagcloud

test:
  commands:
    - $R -e "library('nnTensor')"           # [not win]
    - "\"%R%\" -e \"library('nnTensor')\""  # [win]

about:
  home: https://github.com/rikenbit/nnTensor
  license: MIT
  summary: Some functions for performing non-negative matrix factorization, non-negative CANDECOMP/PARAFAC (CP) decomposition, non-negative Tucker decomposition, and generating toy model data. See Andrzej Cichock et al (2009) <doi:10.1002/9780470747278> and the reference section of GitHub README.md 
    <https://github.com/rikenbit/nnTensor>, for details of the methods.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
